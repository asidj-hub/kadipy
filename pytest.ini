[pytest]

# Indiquer à pytest que le dossier kadi est un module
pythonpath = .

# Exclure les tests d'intégration du run standard (vrais appels réseau).
# Pour les exécuter explicitement : pytest -m integration
addopts = -m "not integration"

# Timeout global par test : évite les blocages sur les appels réseau accidentels
# Installer pytest-timeout dans le groupe dev pour activer cette option
timeout = 30

markers =
    integration: tests qui effectuent de vrais appels réseau (Open-Meteo, WFP, OSRM).