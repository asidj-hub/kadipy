# Workflow : Exécution des tests unitaires
#
# Ce workflow s'exécute automatiquement à chaque push ou pull request
# sur la branche principale. Il garantit que le code ne casse pas avant
# toute fusion ou publication.
#
# Deux jobs distincts :
#   - tests       : tests unitaires (sans appels réseau réels)
#   - integration : tests d'intégration (vrais appels API, bloquants tolérés)

name: Tests

permissions:
  contents: read

on:
  push:
    branches: ["main", "v*"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    # Matrice de versions : on vérifie la compatibilité sur toutes les
    # versions de Python déclarées dans pyproject.toml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      # Étape 1 : Récupération du code source
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      # Étape 2 : Installation de la version Python cible
      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Étape 3 : Installation du package et de ses dépendances de dev
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Étape 4 : Exécution des tests unitaires avec rapport de couverture
      # Les tests d'intégration sont exclus automatiquement via pytest.ini (addopts = -m "not integration")
      # --cov=kadi         : mesure la couverture sur le package principal
      # --cov-report=xml   : génère coverage.xml pour Codecov ou autres outils CI
      # --cov-report=term-missing : affiche les lignes non couvertes dans les logs
      # --cov-fail-under=70 : fait échouer le workflow si la couverture passe sous 70 %
      - name: Exécution des tests avec couverture
        run: |
          pytest tests/ -v --tb=short \
            --cov=kadi \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      # Étape 5 : Envoi du rapport de couverture vers Codecov (optionnel)
      # Exécutée uniquement sur Python 3.11 pour éviter les soumissions en double
      # depuis la matrice multi-versions. fail_ci_if_error=false : une défaillance
      # de Codecov ne bloque pas le workflow principal.
      - name: Envoi du rapport de couverture
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Job séparé pour les tests d'intégration (vrais appels réseau)
  # Exécuté uniquement sur Python 3.11 pour limiter la consommation de minutes CI.
  # continue-on-error: true : un échec réseau transitoire ne bloque pas la release.
  integration:
    name: "Tests d'intégration (réseau réel)"
    runs-on: ubuntu-latest
    needs: tests
    continue-on-error: true

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Les tests d'intégration font de vrais appels réseau vers Open-Meteo,
      # WFP DataBridges et OSRM. Un timeout de 60 secondes par test évite
      # tout blocage en cas de latence élevée du serveur distant.
      # continue-on-error: true évite d'afficher une défaillance globale si une API externe est temporairement indisponible.
      - name: Exécution des tests d'intégration
        continue-on-error: true
        run: |
          pytest tests/integrations/ -v --tb=short -m integration --timeout=60
